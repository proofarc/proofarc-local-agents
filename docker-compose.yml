# Proofarc test agent — runs inside YOUR network, on any machine with Docker.
#
# Playwright agent dials OUT to the Proofarc platform over HTTPS 443 to:
#   - run UI tests on Playwright
#   - crawl sites with Playwright
#
# Nothing here publishes a port. Nothing connects in from outside; the agent asks the platform
# for work, runs it against your application, and sends results back.
#
#   ./start.sh                # logs in to ghcr.io, fetches token if needed, starts agent
#   docker compose logs -f    # "Registered" and "Polling" = connected
#   docker compose down       # stop everything

name: proofarc-agents

x-agent-login: &agent-login
  # A token we give you, OR an agent username and password. The token wins when both are set.
  # With neither, the agents refuse to start (AGENT_NO_CREDENTIALS) — there is no default login.
  JWT_TOKEN: ${PROOFARC_AGENT_TOKEN:-}
  AUTH_USERNAME: ${PROOFARC_AGENT_USERNAME:-}
  AUTH_PASSWORD: ${PROOFARC_AGENT_PASSWORD:-}

services:
  playwright:
    image: ghcr.io/proofarc/playwright:${PROOFARC_VERSION:-v4.8.35}
    shm_size: 1g
    # What the agent needs, and the same as our own cloud agent gets: up to 2 CPUs and 3 GB for two
    # browser jobs at once. With less, a heavy page (a dashboard) can stall or kill the browser.
    # Docker Desktop must itself have at least this much (Settings → Resources): 4 GB and 2 CPUs.
    # On a smaller machine, run one job at a time: PROOFARC_MAX_JOBS=1 in .env.
    cpus: ${PROOFARC_CPUS:-2}
    mem_limit: ${PROOFARC_MEMORY:-3g}
    environment:
      <<: *agent-login
      AGENT_ID: ${PROOFARC_SITE:-customer}-playwright-001
      API_BASE_URL: ${PROOFARC_URL:?set PROOFARC_URL in .env}
      POLL_INTERVAL: "15"
      MAX_CONCURRENT_JOBS: ${PROOFARC_MAX_JOBS:-2}
    restart: unless-stopped
